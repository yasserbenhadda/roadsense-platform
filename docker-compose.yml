services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  postgis:
    image: postgis/postgis:15-3.3
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgis_data:/var/lib/postgresql/data

  ingestion:
    build: ./services/roadsense-ingestion-video
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      - minio
    environment:
      DETECTION_URL: ${DETECTION_URL}
      GEOREF_URL: ${GEOREF_URL}

  detection:
    build: ./services/roadsense-detection-fissures
    ports:
      - "8002:8002"
    env_file: .env
    depends_on:
      - minio

  georef:
    build: ./services/roadsense-georef
    ports:
      - "8003:8003"
    env_file: .env
    depends_on:
      - minio
      - postgis

  score:
    build: ./services/roadsense-score-gravite
    ports:
      - "8004:8004"
    env_file: .env
    depends_on:
      - georef

  dashboard:
    build: ./frontend/roadsense-dashboard
    ports:
      - "8080:80"
    depends_on:
      - georef
      - score

volumes:
  minio_data:
  postgis_data:
