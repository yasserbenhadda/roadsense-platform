version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: georef-db
    environment:
      POSTGRES_DB: roadsense
      POSTGRES_USER: yasser
      POSTGRES_PASSWORD: yasser
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
