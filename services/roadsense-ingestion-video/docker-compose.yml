version: '3.9'
services:
  ingestion:
    build: .
    container_name: ingestion
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - MINIO_ENDPOINT=minio
    depends_on:
      - minio

  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=roadsense
      - MINIO_ROOT_PASSWORD=roadsense123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
