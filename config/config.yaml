# Configuration du microservice de détection de fissures

# Modèles
models:
  yolov8:
    weights_path: "weights/yolov8_cracks.pt"
    input_size: 640
    confidence_threshold: 0.25
    iou_threshold: 0.45
  
  mask_rcnn:
    weights_path: "weights/mask_rcnn_cracks.pth"
    config_path: "config/mask_rcnn_config.yaml"
    confidence_threshold: 0.5

# Dataset
dataset:
  train_split: 0.7
  val_split: 0.2
  test_split: 0.1
  image_size: 640
  batch_size: 16
  num_workers: 4

# Training
training:
  epochs: 100
  learning_rate: 0.01
  weight_decay: 0.0005
  momentum: 0.937
  warmup_epochs: 3
  save_period: 10
  patience: 50

# Augmentation
augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 10
  translate: 0.1
  scale: 0.5
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.1

# MinIO
minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  secure: false
  bucket_name: "crack-detection"
  annotated_bucket: "annotated-images"

# API
api:
  host: "0.0.0.0"
  port: 8000
  max_image_size: 10485760  # 10MB
  timeout: 300

# Database
database:
  host: "localhost"
  port: 5432
  name: "crack_detection"
  user: "postgres"
  password: "postgres"

# Performance targets
targets:
  map50: 0.85
  map50_95: 0.70
  inference_time_ms: 300

